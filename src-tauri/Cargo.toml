[package]
name = "dev-config-hub"
version = "0.1.0"
edition = "2021"

[lib]
name = "dev_config_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# REVIEW_9 C-codex L1 第二次 review: serde_json 必须保留 — `tauri::generate_context!`
# 宏编译期需要它(即便 src 没显式 import)。tauri-plugin-shell / tauri-plugin-dialog 同
# 保留:lib.rs 注册了它们,前端虽然没显式 import 但删除可能影响 Tauri 系统级行为(file
# dialog / open URL 默认 API 由 plugin 提供)。
serde_json = "1"
regex-lite = "0.1"

# REVIEW_7 H4：process group + killpg 杀整组（child.kill 只杀 direct child，
# bun 孙子 + hook 曾孙仍持 stdio pipe FD 让 reader 永不 EOF）。仅 Unix 用。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `tauri-plugin-dialog` does not expose macOS NSSavePanel.showsHiddenFiles.
# Use the already-transitive AppKit bindings directly for the config picker so
# dot-prefixed configuration directories are visible by default.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSOpenPanel",
  "NSPanel",
  "NSResponder",
  "NSSavePanel",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
  "NSURL",
] }
